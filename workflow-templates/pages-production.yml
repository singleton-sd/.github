# Org starter: production GitHub Pages for a marketing site.
# Pin reusable workflows at @v1, never @main.
# Secrets are not stored in singleton-sd/.github; pass them from the caller.
#
# Replace the smoke URL, title, and turnstile_policy before using.
name: Deploy production GitHub Pages

on:
  push:
    branches: [ $default-branch ]
  workflow_dispatch:

concurrency:
  group: pages-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    uses: singleton-sd/.github/.github/workflows/pages-build.yml@v1
    permissions:
      contents: read
    with:
      turnstile_policy: always
      artifact_name: pages-dist

  deploy:
    needs: build
    uses: singleton-sd/.github/.github/workflows/pages-deploy.yml@v1
    permissions:
      contents: read
      actions: read
    with:
      mode: production
      repository: ${{ github.event.repository.name }}
      artifact_name: pages-dist
    secrets:
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

  smoke:
    needs: deploy
    uses: singleton-sd/.github/.github/workflows/pages-smoke.yml@v1
    permissions:
      contents: read
    with:
      url: https://example.singletonsd.com/
      expect_title: Example
