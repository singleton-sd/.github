version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - "/"
      - "/actions/*"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Version updates off; GitHub security updates still open their own PRs.
    open-pull-requests-limit: 0
