# Required check job name: self-test.
# Calls local reusable Pages workflows against the fixture and production URL.
# Never pin this repo's own workflows at @v1 / @main here.
name: self-test

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  pages-build:
    name: pages-build
    permissions:
      contents: read
    uses: ./.github/workflows/pages-build.yml # zizmor: ignore[self-repository]
    with:
      working_directory: tests/fixtures/pages-astro
      artifact_name: self-test-pages-dist
      run_a11y: true
      turnstile_policy: when-lead-intake-enabled

  pages-deploy:
    name: pages-deploy
    needs: pages-build
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/pages-deploy.yml # zizmor: ignore[self-repository]
    with:
      mode: production
      working_directory: tests/fixtures/pages-astro
      artifact_name: self-test-pages-dist
      dry_run: true
      repository: ${{ github.event.repository.name }}

  pages-smoke:
    name: pages-smoke
    permissions:
      contents: read
    uses: ./.github/workflows/pages-smoke.yml # zizmor: ignore[self-repository]
    with:
      url: https://leasemate.singletonsd.com/
      expect_title: LeaseMate
      timeout_ms: 60000

  setup-pnpm-node-ok:
    name: setup-pnpm-node-ok
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Never runs. Records the nested third-party pins that
      # ./actions/setup-pnpm-node uses so actions.lock can cover this workflow.
      - name: Lock nested pnpm pin
        if: ${{ github.run_attempt == 0 }}
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: tests/fixtures/setup-pnpm-node-ok/package.json
          run_install: false

      - name: Lock nested Node pin
        if: ${{ github.run_attempt == 0 }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: tests/fixtures/setup-pnpm-node-ok/.nvmrc
          cache: pnpm
          cache-dependency-path: tests/fixtures/setup-pnpm-node-ok/pnpm-lock.yaml

      - name: Set up pnpm and Node
        id: setup
        uses: ./actions/setup-pnpm-node
        with:
          working_directory: tests/fixtures/setup-pnpm-node-ok

      - name: Assert fixture versions
        env:
          GOT_PNPM: ${{ steps.setup.outputs.pnpm-version }}
          GOT_NODE: ${{ steps.setup.outputs.node-version }}
          GOT_SOURCE: ${{ steps.setup.outputs.node-source }}
        run: |
          set -euo pipefail
          want_pnpm="$(python3 -c 'import json; print(json.load(open("tests/fixtures/setup-pnpm-node-ok/package.json"))["packageManager"].split("@",1)[1].split("+",1)[0])')"
          want_node="$(tr -d ' \t\r\n' < tests/fixtures/setup-pnpm-node-ok/.nvmrc)"
          runtime_pnpm="$(pnpm --version)"
          got_major="${GOT_NODE%%.*}"
          if [ "$GOT_PNPM" != "$want_pnpm" ]; then
            echo "::error::pnpm output ${GOT_PNPM} != fixture ${want_pnpm}"
            exit 1
          fi
          if [ "$runtime_pnpm" != "$want_pnpm" ]; then
            echo "::error::pnpm --version ${runtime_pnpm} != fixture ${want_pnpm}"
            exit 1
          fi
          if [ "$GOT_SOURCE" != "nvmrc" ]; then
            echo "::error::node-source ${GOT_SOURCE} != nvmrc"
            exit 1
          fi
          if [ "$got_major" != "$want_node" ]; then
            echo "::error::node major ${got_major} != fixture ${want_node} (full ${GOT_NODE})"
            exit 1
          fi
          echo "OK pnpm ${GOT_PNPM} node ${GOT_NODE} source ${GOT_SOURCE}"

  setup-pnpm-node-default-node:
    name: setup-pnpm-node-default-node
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm and Node
        id: setup
        uses: ./actions/setup-pnpm-node
        with:
          working_directory: tests/fixtures/setup-pnpm-node-default-node

      - name: Assert docs default Node
        env:
          GOT_PNPM: ${{ steps.setup.outputs.pnpm-version }}
          GOT_NODE: ${{ steps.setup.outputs.node-version }}
          GOT_SOURCE: ${{ steps.setup.outputs.node-source }}
        run: |
          set -euo pipefail
          want_pnpm="$(python3 -c 'import json; print(json.load(open("tests/fixtures/setup-pnpm-node-default-node/package.json"))["packageManager"].split("@",1)[1].split("+",1)[0])')"
          want_node="$(awk '/^default-node:/{print $2; exit}' docs/versions.md)"
          got_major="${GOT_NODE%%.*}"
          if [ "$GOT_PNPM" != "$want_pnpm" ]; then
            echo "::error::pnpm output ${GOT_PNPM} != fixture ${want_pnpm}"
            exit 1
          fi
          if [ "$GOT_SOURCE" != "default" ]; then
            echo "::error::node-source ${GOT_SOURCE} != default"
            exit 1
          fi
          if [ -z "$want_node" ] || [ "$got_major" != "$want_node" ]; then
            echo "::error::node major ${got_major} != docs default ${want_node} (full ${GOT_NODE})"
            exit 1
          fi
          echo "OK pnpm ${GOT_PNPM} node ${GOT_NODE} source ${GOT_SOURCE} default ${want_node}"

  setup-pnpm-node-cache-false:
    name: setup-pnpm-node-cache-false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm and Node without cache
        id: setup
        uses: ./actions/setup-pnpm-node
        with:
          working_directory: tests/fixtures/setup-pnpm-node-npm-root/pkg
          cache: "false"

      - name: Assert fixture versions with cache disabled
        env:
          GOT_PNPM: ${{ steps.setup.outputs.pnpm-version }}
          GOT_NODE: ${{ steps.setup.outputs.node-version }}
          GOT_SOURCE: ${{ steps.setup.outputs.node-source }}
        run: |
          set -euo pipefail
          want_pnpm="$(python3 -c 'import json; print(json.load(open("tests/fixtures/setup-pnpm-node-npm-root/pkg/package.json"))["packageManager"].split("@",1)[1].split("+",1)[0])')"
          want_node="$(tr -d ' \t\r\n' < tests/fixtures/setup-pnpm-node-npm-root/pkg/.nvmrc)"
          runtime_pnpm="$(pnpm --version)"
          got_major="${GOT_NODE%%.*}"
          if [ "$GOT_PNPM" != "$want_pnpm" ]; then
            echo "::error::pnpm output ${GOT_PNPM} != fixture ${want_pnpm}"
            exit 1
          fi
          if [ "$runtime_pnpm" != "$want_pnpm" ]; then
            echo "::error::pnpm --version ${runtime_pnpm} != fixture ${want_pnpm}"
            exit 1
          fi
          if [ "$GOT_SOURCE" != "nvmrc" ]; then
            echo "::error::node-source ${GOT_SOURCE} != nvmrc"
            exit 1
          fi
          if [ "$got_major" != "$want_node" ]; then
            echo "::error::node major ${got_major} != fixture ${want_node} (full ${GOT_NODE})"
            exit 1
          fi
          echo "OK cache=false pnpm ${GOT_PNPM} node ${GOT_NODE}"

  setup-pnpm-node-workspace:
    name: setup-pnpm-node-workspace
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm and Node from workspace package
        id: setup
        uses: ./actions/setup-pnpm-node
        with:
          working_directory: tests/fixtures/setup-pnpm-node-workspace/packages/app

      - name: Assert workspace package versions
        env:
          GOT_PNPM: ${{ steps.setup.outputs.pnpm-version }}
          GOT_NODE: ${{ steps.setup.outputs.node-version }}
          GOT_SOURCE: ${{ steps.setup.outputs.node-source }}
        run: |
          set -euo pipefail
          want_pnpm="$(python3 -c 'import json; print(json.load(open("tests/fixtures/setup-pnpm-node-workspace/packages/app/package.json"))["packageManager"].split("@",1)[1].split("+",1)[0])')"
          want_node="$(tr -d ' \t\r\n' < tests/fixtures/setup-pnpm-node-workspace/packages/app/.nvmrc)"
          runtime_pnpm="$(pnpm --version)"
          got_major="${GOT_NODE%%.*}"
          if [ "$GOT_PNPM" != "$want_pnpm" ]; then
            echo "::error::pnpm output ${GOT_PNPM} != fixture ${want_pnpm}"
            exit 1
          fi
          if [ "$runtime_pnpm" != "$want_pnpm" ]; then
            echo "::error::pnpm --version ${runtime_pnpm} != fixture ${want_pnpm}"
            exit 1
          fi
          if [ "$GOT_SOURCE" != "nvmrc" ]; then
            echo "::error::node-source ${GOT_SOURCE} != nvmrc"
            exit 1
          fi
          if [ "$got_major" != "$want_node" ]; then
            echo "::error::node major ${got_major} != fixture ${want_node} (full ${GOT_NODE})"
            exit 1
          fi
          echo "OK workspace pnpm ${GOT_PNPM} node ${GOT_NODE}"

  setup-pnpm-node-fail:
    name: setup-pnpm-node-fail
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Missing packageManager must fail
        id: no-pm
        continue-on-error: true
        uses: ./actions/setup-pnpm-node
        with:
          working_directory: tests/fixtures/setup-pnpm-node-no-pm

      - name: version input must fail
        id: version-override
        continue-on-error: true
        uses: ./actions/setup-pnpm-node
        with:
          working_directory: tests/fixtures/setup-pnpm-node-ok
          version: "9.0.0"

      - name: Conflicting devEngines must fail
        id: conflict-dev-engines
        continue-on-error: true
        uses: ./actions/setup-pnpm-node
        with:
          working_directory: tests/fixtures/setup-pnpm-node-dev-engines

      - name: Assert failure steps failed
        env:
          NO_PM: ${{ steps.no-pm.outcome }}
          VERSION_OVERRIDE: ${{ steps.version-override.outcome }}
          CONFLICT_DEV_ENGINES: ${{ steps.conflict-dev-engines.outcome }}
        run: |
          set -euo pipefail
          failed=0
          if [ "$NO_PM" != failure ]; then
            echo "::error::no-pm outcome is ${NO_PM}, expected failure"
            failed=1
          else
            echo "OK no-pm failed"
          fi
          if [ "$VERSION_OVERRIDE" != failure ]; then
            echo "::error::version-override outcome is ${VERSION_OVERRIDE}, expected failure"
            failed=1
          else
            echo "OK version override failed"
          fi
          if [ "$CONFLICT_DEV_ENGINES" != failure ]; then
            echo "::error::conflict-dev-engines outcome is ${CONFLICT_DEV_ENGINES}, expected failure"
            failed=1
          else
            echo "OK conflicting devEngines failed"
          fi
          if [ "$failed" -ne 0 ]; then
            exit 1
          fi

  security-scan-clean:
    name: security-scan-clean
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/security-scan.yml # zizmor: ignore[self-repository]
    with:
      working_directory: tests/fixtures/security-scan-clean
      # Fixture job skips dependency review; YAML false is a bool and cannot
      # be assigned to this string input, so the value is a string literal.
      dependency_review: ${{ 'false' }} # zizmor: ignore[obfuscation]

  # Negative fixtures must not call security-scan.yml as jobs: a failed
  # reusable-workflow job is a red check on the PR. Same pattern as
  # setup-pnpm-node-fail: run the contract check at step level and assert.
  security-scan-fail:
    name: security-scan-fail
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Tag-pinned checkout must fail
        env:
          ROOT: tests/fixtures/security-scan-tag-pinned
        run: |
          set -euo pipefail
          set +e
          out="$(node scripts/check-caller-contract.mjs --root "${ROOT}" 2>&1)"
          code=$?
          set -e
          printf '%s\n' "${out}"
          if [ "${code}" -eq 0 ]; then
            echo "::error::tag-pinned fixture unexpectedly passed"
            exit 1
          fi
          case "${out}" in
            *unpinned-uses*) ;;
            *)
              echo "::error::tag-pinned fixture did not report unpinned-uses"
              exit 1
              ;;
          esac
          echo "OK tag-pinned failed with unpinned-uses"

      - name: secrets inherit must fail
        env:
          ROOT: tests/fixtures/security-scan-secrets-inherit
        run: |
          set -euo pipefail
          set +e
          out="$(node scripts/check-caller-contract.mjs --root "${ROOT}" 2>&1)"
          code=$?
          set -e
          printf '%s\n' "${out}"
          if [ "${code}" -eq 0 ]; then
            echo "::error::secrets-inherit fixture unexpectedly passed"
            exit 1
          fi
          case "${out}" in
            *secrets-inherit*) ;;
            *)
              echo "::error::secrets-inherit fixture did not report secrets-inherit"
              exit 1
              ;;
          esac
          echo "OK secrets-inherit failed with secrets-inherit"

      - name: inline azure/login must fail
        env:
          ROOT: tests/fixtures/security-scan-azure-login
        run: |
          set -euo pipefail
          set +e
          out="$(node scripts/check-caller-contract.mjs --root "${ROOT}" 2>&1)"
          code=$?
          set -e
          printf '%s\n' "${out}"
          if [ "${code}" -eq 0 ]; then
            echo "::error::azure-login fixture unexpectedly passed"
            exit 1
          fi
          case "${out}" in
            *inline-azure-login*) ;;
            *)
              echo "::error::azure-login fixture did not report inline-azure-login"
              exit 1
              ;;
          esac
          echo "OK azure-login failed with inline-azure-login"

      - name: First-push range includes earlier secret commit
        run: node --test scripts/gitleaks-log-opts.test.mjs

      - name: Gitleaks adapter fails closed
        run: node --test scripts/summarize-gitleaks.test.mjs

      - name: Isolated python ignores caller yaml.py
        run: node --test --test-name-pattern 'isolated python' scripts/check-caller-contract.test.mjs

      - name: env uses is not an action reference
        run: node --test --test-name-pattern 'schema positions' scripts/check-caller-contract.test.mjs

  security-scan-gitleaks-runtime:
    name: security-scan-gitleaks-runtime
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSLf -o "${RUNNER_TEMP}/${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}" gitleaks
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"

      - name: Detect a runtime-built fake secret
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os

          prefix = "".join(["A", "K", "I", "A"])
          body = "".join(["A", "B", "C", "D", "E", "F", "G", "H", "I", "J", "K", "L", "M", "N", "O", "P"])
          path = Path(os.environ["RUNNER_TEMP"]) / "gitleaks-runtime-fixture.txt"
          path.write_text(f"token={prefix}{body}\n", encoding="utf8")
          PY
          json="${RUNNER_TEMP}/gitleaks-runtime.json"
          set +e
          gitleaks detect --no-git --redact --no-banner --exit-code 1 \
            --source "${RUNNER_TEMP}/gitleaks-runtime-fixture.txt" \
            --report-format json --report-path "${json}" \
            >/dev/null 2>&1
          code=$?
          set -e
          python3 - "$code" "${json}" <<'PY'
          import json
          import sys
          from pathlib import Path

          code = int(sys.argv[1])
          path = Path(sys.argv[2])
          findings = []
          if path.is_file() and path.read_text(encoding="utf8").strip():
              loaded = json.loads(path.read_text(encoding="utf8"))
              if isinstance(loaded, list):
                  findings = loaded
          rules = sorted(
              {
                  str(item.get("RuleID") or item.get("Rule") or "unknown")
                  for item in findings
                  if isinstance(item, dict)
              }
          )
          if code not in (0, 1):
              print(f"::error::gitleaks runtime test failed with exit {code}")
              raise SystemExit(1)
          if not findings:
              print("::error::gitleaks did not report the runtime-built fixture")
              raise SystemExit(1)
          print(f"gitleaks runtime: {len(findings)} finding(s); rules: {', '.join(rules)}")
          PY
          rm -f "${RUNNER_TEMP}/gitleaks-runtime-fixture.txt" "${json}"

  self-test:
    name: self-test
    if: always()
    needs:
      [
        pages-build,
        pages-deploy,
        pages-smoke,
        setup-pnpm-node-ok,
        setup-pnpm-node-default-node,
        setup-pnpm-node-cache-false,
        setup-pnpm-node-workspace,
        setup-pnpm-node-fail,
        security-scan-clean,
        security-scan-fail,
        security-scan-gitleaks-runtime,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Require reusable workflow jobs
        env:
          BUILD: ${{ needs.pages-build.result }}
          DEPLOY: ${{ needs.pages-deploy.result }}
          SMOKE: ${{ needs.pages-smoke.result }}
          SETUP_OK: ${{ needs.setup-pnpm-node-ok.result }}
          SETUP_DEFAULT: ${{ needs.setup-pnpm-node-default-node.result }}
          SETUP_CACHE_FALSE: ${{ needs.setup-pnpm-node-cache-false.result }}
          SETUP_WORKSPACE: ${{ needs.setup-pnpm-node-workspace.result }}
          SETUP_FAIL: ${{ needs.setup-pnpm-node-fail.result }}
          SCAN_CLEAN: ${{ needs.security-scan-clean.result }}
          SCAN_FAIL: ${{ needs.security-scan-fail.result }}
          SCAN_GITLEAKS: ${{ needs.security-scan-gitleaks-runtime.result }}
        run: |
          set -euo pipefail
          failed=0
          for pair in "pages-build:${BUILD}" "pages-deploy:${DEPLOY}" "pages-smoke:${SMOKE}" "setup-pnpm-node-ok:${SETUP_OK}" "setup-pnpm-node-default-node:${SETUP_DEFAULT}" "setup-pnpm-node-cache-false:${SETUP_CACHE_FALSE}" "setup-pnpm-node-workspace:${SETUP_WORKSPACE}" "setup-pnpm-node-fail:${SETUP_FAIL}" "security-scan-clean:${SCAN_CLEAN}" "security-scan-fail:${SCAN_FAIL}" "security-scan-gitleaks-runtime:${SCAN_GITLEAKS}"; do
            name="${pair%%:*}"
            result="${pair#*:}"
            if [ "$result" != success ]; then
              echo "::error::${name} result is ${result}"
              failed=1
            else
              echo "OK ${name} success"
            fi
          done
          if [ "$failed" -ne 0 ]; then
            exit 1
          fi
