# CI for this repository. Reusable workflows only run on workflow_call, so
# they never execute here. Job names are the required check-run names.
name: self-ci

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  self-ci:
    name: self-ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: "1.7.12"
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSLf -o "/tmp/${archive}" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          tar -xzf "/tmp/${archive}" -C /tmp actionlint
          echo /tmp >> "$GITHUB_PATH"

      - name: Run actionlint
        run: actionlint -color .github/workflows/*.yml workflow-templates/*.yml

      - name: Run shellcheck
        run: |
          set -euo pipefail
          shellcheck --version
          find scripts actions -name '*.sh' -print0 | xargs -0 --no-run-if-empty shellcheck

      - name: Check Azure OIDC policy
        run: bash scripts/check-azure-oidc-policy.sh

      - name: Check release workflow policy
        run: bash scripts/check-release-workflow-policy.sh

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Syntax-check smoke-live.mjs
        run: node --check scripts/smoke-live.mjs

      - name: Run Node tests
        run: node --test scripts/smoke-live.test.mjs scripts/lint-contract.test.mjs scripts/check-caller-contract.test.mjs scripts/gitleaks-log-opts.test.mjs scripts/summarize-gitleaks.test.mjs scripts/summarize-actionlint.test.mjs

      - name: Verify actions.lock
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh extension install github/gh-actions-lock --pin v0.5.1
          # actionlint 1.7.12 rejects uses: $/. Nested pins of the local
          # composite are recorded on self-test.yml via if: false steps.
          gh actions-lock --verify-local --ignore-local-actions

      - name: Lint reusable workflow contract
        run: node scripts/lint-contract.mjs

      - name: Dependabot-style composite pin drop must pass
        env:
          ROOT: tests/fixtures/actions-lock-dependabot-drop
        run: node scripts/lint-contract.mjs "${ROOT}"

      - name: Composite pin mismatch must fail
        env:
          ROOT: tests/fixtures/actions-lock-composite-mismatch
        run: |
          set -euo pipefail
          set +e
          out="$(node scripts/lint-contract.mjs "${ROOT}" 2>&1)"
          code=$?
          set -e
          printf '%s\n' "${out}"
          if [ "${code}" -eq 0 ]; then
            echo "::error::composite mismatch fixture unexpectedly passed"
            exit 1
          fi
          case "${out}" in
            *azure/login*does\ not\ match*) ;;
            *)
              echo "::error::composite mismatch fixture did not report azure/login SHA mismatch"
              exit 1
              ;;
          esac
          echo "OK composite mismatch failed with azure/login SHA mismatch"

      - name: Test Turnstile policy guard
        run: bash scripts/check-turnstile-policy.test.sh

      - name: Test working_directory path joins
        run: bash scripts/check-workflow-paths.test.sh

      - name: Test Azure OIDC guard
        run: bash scripts/azure-oidc-guard.test.sh

      - name: Test Azure Key Vault read
        run: bash scripts/azure-kv-read.test.sh

      - name: Test Azure OIDC policy guard
        run: bash scripts/check-azure-oidc-policy.test.sh

      - name: Test next-release-tag
        run: bash scripts/next-release-tag.test.sh

      - name: Test release workflow policy
        run: bash scripts/check-release-workflow-policy.test.sh

      - name: Test setup-pnpm-node guard
        run: bash scripts/setup-pnpm-node-guard.test.sh

      - name: Test npm-publish guard
        run: bash scripts/npm-publish-guard.test.sh

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@1b4550e929643b8b26a62303c6bd64814271a4f1 # v0.9.2
        with:
          advanced-security: false
          annotations: true
          config: .github/zizmor.yml
          inputs: |
            .github/workflows/pages-build.yml
            .github/workflows/pages-deploy.yml
            .github/workflows/pages-smoke.yml
            .github/workflows/self-ci.yml
            .github/workflows/self-test.yml
            .github/workflows/self-release.yml
            .github/workflows/security-scan.yml
            workflow-templates
            actions
